name: CSV action Windows and Linux
on:
  push:
    branches: [main]
    tags: ['csv-action-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  csv-action:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Adapter contracts
        run: python tools/test_csv_ci.py
      - name: Valid rows pass
        id: clean
        uses: ./
        with:
          csv: examples/ci/clean.csv
          price-decimals: '2'
          volume-decimals: '0'
          report-directory: artifacts/ci-clean
      - name: Quarantined rows fail the job step
        id: quarantine
        continue-on-error: true
        uses: ./
        with:
          csv: examples/ci/quarantine.csv
          price-decimals: '2'
          volume-decimals: '0'
          report-directory: artifacts/ci-quarantine
      - name: Malformed framing fails the job step
        id: fatal
        continue-on-error: true
        uses: ./
        with:
          csv: examples/ci/fatal.csv
          price-decimals: '2'
          volume-decimals: '0'
          report-directory: artifacts/ci-fatal
      - name: Check actual outcomes and reports
        shell: python
        env:
          CLEAN: ${{ steps.clean.outputs.exit-code }}
          QUARANTINE: ${{ steps.quarantine.outputs.exit-code }}
          FATAL: ${{ steps.fatal.outputs.exit-code }}
          QUARANTINE_OUTCOME: ${{ steps.quarantine.outcome }}
          FATAL_OUTCOME: ${{ steps.fatal.outcome }}
        run: |
          import json,os
          from pathlib import Path
          assert (os.environ['CLEAN'],os.environ['QUARANTINE'],os.environ['FATAL'])==('0','2','1')
          assert os.environ['QUARANTINE_OUTCOME']==os.environ['FATAL_OUTCOME']=='failure'
          assert (Path('artifacts/ci-clean')/'summary.json').is_file()
          assert (Path('artifacts/ci-quarantine')/'summary.json').is_file()
          assert not (Path('artifacts/ci-fatal')/'summary.json').exists()
