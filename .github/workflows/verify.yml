name: A3 Windows and Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "0"
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: dotnet restore tests/Integrity.Tests/Integrity.Tests.csproj --locked-mode
      - run: dotnet build tests/Integrity.Tests/Integrity.Tests.csproj -c Release --no-restore
      - run: dotnet run --project tests/Integrity.Tests -c Release --no-build
      - run: dotnet restore tools/Measurements/Measurements.csproj --locked-mode
      - run: dotnet build tools/Measurements/Measurements.csproj -c Release --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/test_measurements.py
      - run: python tools/check_measurements.py --dotnet dotnet
      - run: dotnet run --project src/Integrity -c Release --no-build -- generate artifacts/demo 34
      - name: Exercise CLI degraded result
        shell: bash
        run: |
          set +e
          dotnet run --project src/Integrity -c Release --no-build -- validate artifacts/demo/manifest.json artifacts/demo/input.jsonl artifacts/result
          result=$?
          set -e
          test "$result" -eq 2
      - run: dotnet run --project src/Integrity -c Release --no-build -- generate-sequence artifacts/sequence-demo
      - name: Exercise opt-in sequence CLI
        shell: bash
        run: |
          set +e
          dotnet run --project src/Integrity -c Release --no-build -- validate-sequence artifacts/sequence-demo/manifest.json artifacts/sequence-demo/input.jsonl artifacts/sequence-result
          result=$?
          set -e
          test "$result" -eq 2
      - name: Retain finite synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ matrix.os }}
          path: artifacts/recovery-tests/
          retention-days: 7
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package tested source and publish preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="market-data-integrity-lab-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=market-data-integrity-lab/ -o "$archive" HEAD
          sha256sum "$archive" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS.txt --verify-tag --prerelease --title "A3 source preview $GITHUB_REF_NAME" --notes "Synthetic-only A3: preserved A1/A2 validation plus opt-in process-crash checkpoint/resume, verified fallback and bounded evidence preservation. Source package; requires .NET SDK 10.0.403 and enabled local .NET locking. No power-loss, hostile-FS, distributed exactly-once or performance guarantee."
