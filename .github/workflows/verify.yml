name: Portfolio Windows and Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Fixed own input graph curation or full product validation
        type: choice
        options: [product, input-curation]
        default: product
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "0"
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    name: Integrity03 native (${{ matrix.os }} ${{ matrix.rid }})
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Own current held caps and fixed input or product gate
        if: github.event.inputs.stage != 'input-curation' || matrix.rid == 'linux-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_STAGE: ${{ github.event.inputs.stage || 'product' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bindingPath = Join-Path $PWD '.github/ci/integrity03-supported-binding.json'
          if ((Get-FileHash -LiteralPath $bindingPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f87119197a88bd907a8b067f01ce868e0dc5b9fbd759d32b781acd1fea7d3339') { throw 'BINDING_IDENTITY' }
          $binding = [IO.File]::ReadAllText($bindingPath) | ConvertFrom-Json
          if ($IsWindows) {
            $python = Join-Path $env:RUNNER_TOOL_CACHE $binding.controllerPython.'win-x64'.pathRelativeToRunnerToolCache
            $expected = $binding.controllerPython.'win-x64'.sha256
            $dll = Join-Path (Split-Path $python) 'python312.dll'
            if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9a0e3435aaa680d868150f87ab3e388ad2eebc22f87e036155c7b4eda8cd2120') { throw 'PYTHON_DLL' }
            foreach ($p in @($python, $dll)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $p
              if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw 'PYTHON_SIGNATURE' }
            }
          } else { $python = $binding.controllerPython.'linux-x64'.path; $expected = $binding.controllerPython.'linux-x64'.sha256 }
          if (-not [IO.Path]::IsPathFullyQualified($python)) { throw 'ABSOLUTE_EXISTING_CONTROLLER_REQUIRED' }
          if ((Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'CONTROLLER_IDENTITY' }
          & $python -E .github/ci/host_controller03.py --binding $bindingPath --binding-sha256 f87119197a88bd907a8b067f01ce868e0dc5b9fbd759d32b781acd1fea7d3339 --stage $env:OWN_STAGE
          if ($LASTEXITCODE -ne 0) { throw 'OWN_CI_ROUTE_INCOMPLETE' }
      - name: Retain tested runtime archive
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.event.inputs.stage != 'input-curation'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: |
            artifacts/binary/*.zip
            artifacts/binary/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
      - name: Retain finite verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.rid }}
          path: |
            artifacts/recovery-tests/
            artifacts/binary-smoke-*.json
            artifacts/runtime-locks/
            artifacts/input-curation/
            artifacts/host-proof/
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Verify tested archives, package source and publish preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v0.6.2-preview.1"
          python tools/check_release_archives.py release-assets "$GITHUB_SHA"
          archive="market-data-integrity-lab-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=market-data-integrity-lab/ -o "release-assets/$archive" HEAD
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz SHA256SUMS.txt --verify-tag --draft --prerelease --title "Offline CSV .NET 11 technology refresh $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/docs/RELEASE-v0.6.2-preview.1.md"
