name: Portfolio Windows and Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "0"
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - run: dotnet restore tests/Integrity.Tests/Integrity.Tests.csproj --locked-mode
      - run: dotnet build tests/Integrity.Tests/Integrity.Tests.csproj -c Release --no-restore
      - run: dotnet run --project tests/Integrity.Tests -c Release --no-build
      - run: dotnet restore tools/Measurements/Measurements.csproj --locked-mode
      - run: dotnet build tools/Measurements/Measurements.csproj -c Release --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/test_measurements.py
      - run: python tools/analyze_measurements.py docs/evidence/measurements artifacts/recomputed-a4-summary.json
      - run: python tools/check_measurements.py --dotnet dotnet
      - run: dotnet run --project src/Integrity -c Release --no-build -- generate artifacts/demo 34
      - name: Exercise CLI degraded result
        shell: bash
        run: |
          set +e
          dotnet run --project src/Integrity -c Release --no-build -- validate artifacts/demo/manifest.json artifacts/demo/input.jsonl artifacts/result
          result=$?
          set -e
          test "$result" -eq 2
      - run: dotnet run --project src/Integrity -c Release --no-build -- generate-sequence artifacts/sequence-demo
      - name: Exercise opt-in sequence CLI
        shell: bash
        run: |
          set +e
          dotnet run --project src/Integrity -c Release --no-build -- validate-sequence artifacts/sequence-demo/manifest.json artifacts/sequence-demo/input.jsonl artifacts/sequence-result
          result=$?
          set -e
          test "$result" -eq 2
      - name: Publish and inventory self-contained runtime
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDirectory = Join-Path $PWD "artifacts/publish/$env:TARGET_RID"
          $lockPath = Join-Path $PWD "artifacts/runtime-locks/$env:TARGET_RID.lock.json"
          New-Item -ItemType Directory -Force (Split-Path $lockPath) | Out-Null
          dotnet publish src/Integrity/Integrity.csproj -c Release -r $env:TARGET_RID --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishAot=false -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -p:RuntimeFrameworkVersion=10.0.15 "-p:NuGetLockFilePath=$lockPath" -o $publishDirectory
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          $packageLocation = (dotnet nuget locals global-packages --list)
          $packageRoot = $packageLocation.Substring($packageLocation.IndexOf(':') + 1).Trim()
          $runtimePack = Join-Path $packageRoot "microsoft.netcore.app.runtime.$env:TARGET_RID/10.0.15"
          $sdkVersion = (dotnet --version).Trim()
          python tools/package_binary.py --publish $publishDirectory --output artifacts/binary --rid $env:TARGET_RID --runtime-pack $runtimePack --commit "${{ github.sha }}" --sdk $sdkVersion
          if ($LASTEXITCODE -ne 0) { throw 'packaging failed' }
      - name: Extract actual archive and launch apphost directly
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "market-data-integrity-lab-v0.6.1-preview.1-$env:TARGET_RID"
          $extractRoot = Join-Path $PWD 'artifacts/extracted package with spaces'
          New-Item -ItemType Directory $extractRoot | Out-Null
          if ($env:TARGET_RID -eq 'win-x64') {
            Expand-Archive -LiteralPath "artifacts/binary/$prefix.zip" -DestinationPath $extractRoot
          } else {
            tar -xzf "artifacts/binary/$prefix.tar.gz" -C $extractRoot
            if ($LASTEXITCODE -ne 0) { throw 'tar extraction failed' }
          }
          python tools/check_binary.py --package (Join-Path $extractRoot $prefix) --work (Join-Path $PWD 'artifacts/apphost cwd with spaces') --commit "${{ github.sha }}" --receipt "artifacts/binary-smoke-$env:TARGET_RID.json"
          if ($LASTEXITCODE -ne 0) { throw 'extracted apphost check failed' }
      - name: Retain tested runtime archive
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: |
            artifacts/binary/*.zip
            artifacts/binary/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
      - name: Retain finite verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.rid }}
          path: |
            artifacts/recovery-tests/
            artifacts/binary-smoke-*.json
            artifacts/runtime-locks/
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Verify tested archives, package source and publish preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v0.6.1-preview.1"
          python tools/check_release_archives.py release-assets "$GITHUB_SHA"
          archive="market-data-integrity-lab-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=market-data-integrity-lab/ -o "release-assets/$archive" HEAD
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz SHA256SUMS.txt --verify-tag --prerelease --title "Offline CSV usage diagnostics $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/docs/RELEASE-v0.6.1-preview.1.md"
